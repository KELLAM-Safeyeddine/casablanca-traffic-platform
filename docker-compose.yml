name: casablanca-traffic-platform

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE:-casablanca-traffic-airflow:2.11.2-python3.11}
  build:
    context: .
    dockerfile: Dockerfile.airflow
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Generate .env}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Generate .env}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Generate .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Africa/Casablanca
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW_CONN_CASATRAFFIC: postgresql://traffic:${TRAFFIC_DB_PASSWORD:?Generate .env}@postgres:5432/traffic
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./sql:/opt/airflow/sql:ro
    - ./data/source:/opt/airflow/data/source:ro
    - ./data/raw:/opt/airflow/data/raw
    - ./data/quarantine:/opt/airflow/data/quarantine
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.5}
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Generate .env}
      TRAFFIC_DB_PASSWORD: ${TRAFFIC_DB_PASSWORD:?Generate .env}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?Generate .env}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?Generate .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sh:/docker-entrypoint-initdb.d/10-init-platform.sh:ro
      - ./sql/ddl/00_platform.sql:/opt/bootstrap/00_platform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U platform_admin -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Generate .env}
      _AIRFLOW_WWW_USER_FIRSTNAME: Casa
      _AIRFLOW_WWW_USER_LASTNAME: Traffic
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.test}
    command: version
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.59.31.x}
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Generate .env}
      JAVA_TIMEZONE: Africa/Casablanca
      JAVA_OPTS: -Xmx1g
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  dashboard:
    image: casablanca-traffic-dashboard:python3.11
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      DASHBOARD_DB_HOST: postgres
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?Run scripts/init_dashboard.py}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER:-traffic_dashboard}
      DASHBOARD_DB_NAME: ${DASHBOARD_DB_NAME:-traffic}
      DASHBOARD_METADATA_ROOT: /app/metadata
    volumes:
      - ./data/monitoring:/app/metadata:ro
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  dashboard-status:
    image: ${AIRFLOW_IMAGE:-casablanca-traffic-airflow:2.11.2-python3.11}
    entrypoint: ["python", "-m", "src.load.dashboard_status"]
    environment:
      PYTHONPATH: /opt/airflow
      STATUS_DB_HOST: postgres
      STATUS_DB_PASSWORD: ${TRAFFIC_DB_PASSWORD:?Generate .env}
      STATUS_AIRFLOW_URL: http://airflow-webserver:8080/api/v1
      STATUS_AIRFLOW_USER: ${AIRFLOW_ADMIN_USERNAME:-admin}
      STATUS_AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Generate .env}
      DASHBOARD_STATUS_INTERVAL: ${DASHBOARD_STATUS_INTERVAL:-60}
    volumes:
      - ./src:/opt/airflow/src:ro
      - ./data/quarantine/reports:/opt/airflow/reports:ro
      - ./data/monitoring:/opt/airflow/monitoring
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,datetime,pathlib; p=pathlib.Path('/opt/airflow/monitoring/dashboard_status.json'); d=json.loads(p.read_text()); assert (datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(d['collected_at'])).total_seconds()<180"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres_data:
