[server]
headless = true
[browser]
gatherUsageStats = false
[client]
toolbarMode = "viewer"
showErrorDetails = "none"
[theme]
font = "sans serif"
baseRadius = "large"
[theme.light]
primaryColor = "#087A86"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#050A12"
grayTextColor = "#526174"
[theme.dark]
primaryColor = "#58CCD4"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#162033"
textColor = "#F1F5F9"
