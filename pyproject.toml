[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["CasaTraffic", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: PostgreSQL/PostGIS temporaire via scripts/run_integration_tests.py"]
